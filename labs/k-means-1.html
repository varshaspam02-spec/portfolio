<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clustering algorithms compared | Srinjoy Ghosh</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/lab.css">
<script src="../assets/lab-bridge.js"></script>
<style>
  .panel-head .seg{flex:0 1 auto}
  /* The name column stays put while the rest scrolls sideways on narrow screens. */
  th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:#10121c;box-shadow:1px 0 0 var(--line)}
  th:first-child{z-index:2}
  td:first-child{font-weight:550}
  td:last-child{color:var(--muted)}
  /* Family is identity: a fixed swatch per family, with the name in ink beside it. */
  .family{display:inline-flex;align-items:center;gap:8px}
  .family::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c)}
  [data-family=Centroid]{--c:var(--s1)}
  [data-family=Hierarchical]{--c:var(--s2)}
  [data-family=Density]{--c:var(--s3)}
  [data-family=Graph]{--c:var(--s4)}
  /* Ratings are ordered, so they share one hue and differ by how many steps are lit. */
  .rating{display:inline-flex;align-items:center;gap:10px}
  .meter{display:inline-flex;gap:2px}
  .meter i{width:6px;height:14px;border-radius:2px;background:rgba(255,255,255,.1)}
  .meter i.on{background:var(--s1)}
  .param{font:12.5px var(--mono);color:var(--muted)}
  .here{margin-left:8px}
</style>
</head>
<body>
<div class="lab">
  <header class="lab-head">
    <div><a class="lab-back" href="../spaces/k-means/index.html">&larr; Back to K-Means</a><h1>Clustering algorithms compared</h1></div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2>Comparative summary</h2>
      <div class="seg" role="group" aria-label="Filter by algorithm family" id="filter">
        <button type="button" aria-pressed="true" data-show="All">All</button>
        <button type="button" aria-pressed="false" data-show="Centroid">Centroid</button>
        <button type="button" aria-pressed="false" data-show="Hierarchical">Hierarchical</button>
        <button type="button" aria-pressed="false" data-show="Density">Density</button>
        <button type="button" aria-pressed="false" data-show="Graph">Graph</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col">Algorithm</th><th scope="col">Type</th><th scope="col">Cluster shape</th><th scope="col">Outliers</th><th scope="col">Scalability</th><th scope="col">Parameters</th><th scope="col">Best for</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <div class="statusbar" id="status" role="status" aria-live="polite">Showing all 11 algorithms.</div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // name, family, cluster shape, outliers, scalability, parameters, best for
  const ALGORITHMS = [
    ['K-Means', 'Centroid', 'Spherical', 'Sensitive', 'Excellent', 'k', 'Large datasets, spherical clusters'],
    ['K-Means++', 'Centroid', 'Spherical', 'Sensitive', 'Excellent', 'k', 'Better initialization than K-Means'],
    ['Mini-Batch K-Means', 'Centroid', 'Spherical', 'Sensitive', 'Excellent++', 'k, batch_size', 'Huge datasets, streaming'],
    ['K-Medoids', 'Centroid', 'Spherical', 'Robust', 'Poor', 'k', 'Outliers, non-Euclidean metrics'],
    ['Agglomerative', 'Hierarchical', 'Flexible', 'Depends', 'Poor', 'linkage, distance', 'Hierarchical structure, small data'],
    ['Ward', 'Hierarchical', 'Spherical', 'Moderate', 'Poor', 'distance', 'Default hierarchical choice'],
    ['BIRCH', 'Hierarchical', 'Spherical', 'Moderate', 'Excellent', 'threshold, branching', 'Very large datasets'],
    ['DBSCAN', 'Density', 'Arbitrary', 'Robust', 'Good', 'ε, minPts', 'Non-convex clusters, outliers'],
    ['Mean Shift', 'Density', 'Arbitrary', 'Robust', 'Poor', 'bandwidth', 'Unknown k, computer vision'],
    ['Spectral', 'Graph', 'Arbitrary', 'Sensitive', 'Poor', 'k, σ', 'Non-convex, manifold data'],
    ['Affinity Prop', 'Graph', 'Arbitrary', 'Robust', 'Poor', 'preference', 'Unknown k, exemplars needed'],
  ];
  // Lit steps out of the scale's length. "Depends" has no place on the scale, so it shows none.
  const OUTLIERS = { Sensitive: [1, 3], Moderate: [2, 3], Robust: [3, 3], Depends: [0, 3] };
  const SCALABILITY = { Poor: [1, 4], Good: [2, 4], Excellent: [3, 4], 'Excellent++': [4, 4] };

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function rating(label, [lit, steps]) {
    const wrap = el('span', 'rating');
    const meter = el('span', 'meter');
    meter.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < steps; i++) meter.append(el('i', i < lit ? 'on' : ''));
    wrap.append(meter, label);
    return wrap;
  }

  const body = document.getElementById('rows');
  for (const [name, family, shape, outliers, scalability, parameters, bestFor] of ALGORITHMS) {
    const row = el('tr');
    row.dataset.family = family;
    const first = el('td', '', name);
    if (name === 'K-Means') first.append(el('span', 'chip here', 'This lab'));
    const type = el('td');
    const badge = el('span', 'family', family);
    badge.dataset.family = family;
    type.append(badge);
    const out = el('td');
    out.append(rating(outliers, OUTLIERS[outliers]));
    const scale = el('td');
    scale.append(rating(scalability, SCALABILITY[scalability]));
    const params = el('td');
    params.append(el('span', 'param', parameters));
    row.append(first, type, el('td', '', shape), out, scale, params, el('td', '', bestFor));
    body.append(row);
  }

  const buttons = [...document.querySelectorAll('#filter button')];
  buttons.forEach(button => button.addEventListener('click', () => {
    const show = button.dataset.show;
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    let count = 0;
    for (const row of body.rows) {
      row.hidden = show !== 'All' && row.dataset.family !== show;
      if (!row.hidden) count++;
    }
    SGLab.status(document.getElementById('status'), 'idle', show === 'All' ? `Showing all ${count} algorithms.` : `Showing ${count} ${show.toLowerCase()}-based ${count === 1 ? 'algorithm' : 'algorithms'}.`);
    SGLab.resize();
  }));
})();
</script>
</body>
</html>
