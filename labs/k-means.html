<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Means Clustering - Modern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .app {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }
        
        .panel {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .control {
            margin-bottom: 30px;
        }
        
        .control label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 700;
            color: #2d3748;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .value {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 16px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }
        
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ee0979, #ff6a00);
            color: white;
        }
        
        canvas {
            width: 100%;
            border-radius: 20px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .status {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea15, #764ba215);
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
            color: #2d3748;
            font-size: 16px;
        }
        
        .stats {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            font-size: 13px;
            color: #4a5568;
            line-height: 1.8;
        }
        
        .stats strong {
            color: #2d3748;
        }
    </style>
<link rel="stylesheet" href="../assets/lab-theme.css">
<script defer src="../assets/lab-bridge.js"></script>
</head>
<body>
    <div class="app">
        <h1>K-Means Clustering</h1>
        
        <div class="layout">
            <div class="panel">
                <div class="control">
                    <label>
                        Clusters (K)
                        <span class="value" id="kValue">3</span>
                    </label>
                    <input type="range" id="kSlider" min="2" max="8" value="3">
                </div>
                
                <div class="control">
                    <label>
                        Data Points (N)
                        <span class="value" id="nValue">150</span>
                    </label>
                    <input type="range" id="nSlider" min="50" max="400" step="50" value="150">
                </div>
                
                <button class="btn-primary" onclick="generateData()">🎲 Generate Data</button>
                <button class="btn-success" onclick="runClustering()">▶️ Run Clustering</button>
                <button class="btn-danger" onclick="resetAll()">🔄 Reset</button>
                
                <div class="stats">
                    <div><strong>Iterations:</strong> <span id="iterCount">0</span></div>
                    <div><strong>Status:</strong> <span id="statusText">Ready</span></div>
                    <div><strong>Points:</strong> <span id="pointCount">0</span></div>
                    <div><strong>Clusters:</strong> <span id="clusterCount">0</span></div>
                </div>
            </div>
            
            <div>
                <canvas id="canvas" width="800" height="600"></canvas>
                <div class="status" id="mainStatus">
                    Adjust K and N, then click Generate Data to start
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let K = 3;
        let N = 150;
        let points = [];
        let centroids = [];
        let assignments = [];
        let iteration = 0;
        let isRunning = false;
        let converged = false;
        
        const COLORS = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
            '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'
        ];
        
        // Sliders
        document.getElementById('kSlider').oninput = function() {
            K = parseInt(this.value);
            document.getElementById('kValue').textContent = K;
            document.getElementById('clusterCount').textContent = K;
        };
        
        document.getElementById('nSlider').oninput = function() {
            N = parseInt(this.value);
            document.getElementById('nValue').textContent = N;
        };
        
        function generateData() {
            points = [];
            const numClusters = Math.min(K + 1, 6);
            const pointsPerCluster = Math.floor(N / numClusters);
            
            // Create well-separated cluster centers
            const centers = [];
            for (let i = 0; i < numClusters; i++) {
                let x, y, valid;
                do {
                    x = 100 + Math.random() * 600;
                    y = 100 + Math.random() * 400;
                    valid = centers.every(c => 
                        Math.hypot(x - c.x, y - c.y) > 150
                    );
                } while (!valid && centers.length > 0);
                centers.push({x, y});
            }
            
            // Generate points around centers
            centers.forEach(center => {
                for (let i = 0; i < pointsPerCluster; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 60 + 20;
                    points.push({
                        x: center.x + Math.cos(angle) * radius,
                        y: center.y + Math.sin(angle) * radius
                    });
                }
            });
            
            centroids = [];
            assignments = new Array(points.length).fill(-1);
            iteration = 0;
            converged = false;
            isRunning = false;
            
            updateStats();
            draw();
            updateStatus('Data generated! Click Run Clustering to start.');
        }
        
        function runClustering() {
            if (points.length === 0) {
                updateStatus('Generate data first!');
                return;
            }
            
            if (isRunning) {
                isRunning = false;
                updateStatus('Clustering paused.');
                return;
            }
            
            // Initialize centroids randomly
            if (centroids.length === 0) {
                for (let i = 0; i < K; i++) {
                    centroids.push({
                        x: 50 + Math.random() * 700,
                        y: 50 + Math.random() * 500
                    });
                }
            }
            
            isRunning = true;
            updateStatus('Clustering in progress...');
            animate();
        }
        
        function animate() {
            if (!isRunning || converged) return;
            
            iteration++;
            
            // Store old centroids
            const oldCentroids = centroids.map(c => ({...c}));
            
            // Assignment step
            for (let i = 0; i < points.length; i++) {
                let minDist = Infinity;
                let closest = 0;
                
                for (let k = 0; k < K; k++) {
                    const dist = Math.hypot(
                        points[i].x - centroids[k].x,
                        points[i].y - centroids[k].y
                    );
                    if (dist < minDist) {
                        minDist = dist;
                        closest = k;
                    }
                }
                assignments[i] = closest;
            }
            
            draw();
            
            // Update step
            setTimeout(() => {
                for (let k = 0; k < K; k++) {
                    const cluster = points.filter((_, i) => assignments[i] === k);
                    if (cluster.length > 0) {
                        centroids[k] = {
                            x: cluster.reduce((s, p) => s + p.x, 0) / cluster.length,
                            y: cluster.reduce((s, p) => s + p.y, 0) / cluster.length
                        };
                    }
                }
                
                // Check convergence
                const maxMove = oldCentroids.reduce((max, old, i) => {
                    const move = Math.hypot(
                        old.x - centroids[i].x,
                        old.y - centroids[i].y
                    );
                    return Math.max(max, move);
                }, 0);
                
                converged = maxMove < 0.5;
                
                updateStats();
                draw();
                
                if (converged) {
                    isRunning = false;
                    updateStatus(`✓ Converged in ${iteration} iterations!`);
                } else {
                    updateStatus(`Running... Iteration ${iteration}`);
                    setTimeout(animate, 500);
                }
            }, 250);
        }
        
        function resetAll() {
            points = [];
            centroids = [];
            assignments = [];
            iteration = 0;
            isRunning = false;
            converged = false;
            updateStats();
            draw();
            updateStatus('Reset complete. Generate new data to start.');
        }
        
        function draw() {
            ctx.clearRect(0, 0, 800, 600);
            
            // Draw connection lines
            if (centroids.length > 0) {
                ctx.globalAlpha = 0.1;
                ctx.lineWidth = 1;
                for (let i = 0; i < points.length; i++) {
                    if (assignments[i] >= 0) {
                        ctx.strokeStyle = COLORS[assignments[i]];
                        ctx.beginPath();
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(centroids[assignments[i]].x, centroids[assignments[i]].y);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
            }
            
            // Draw points
            for (let i = 0; i < points.length; i++) {
                const color = assignments[i] >= 0 ? COLORS[assignments[i]] : '#95a5a6';
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(points[i].x, points[i].y, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // Draw centroids
            for (let k = 0; k < centroids.length; k++) {
                // Glow effect
                ctx.fillStyle = COLORS[k] + '20';
                ctx.beginPath();
                ctx.arc(centroids[k].x, centroids[k].y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Main circle
                ctx.fillStyle = COLORS[k];
                ctx.beginPath();
                ctx.arc(centroids[k].x, centroids[k].y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Cross
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(centroids[k].x - 7, centroids[k].y);
                ctx.lineTo(centroids[k].x + 7, centroids[k].y);
                ctx.moveTo(centroids[k].x, centroids[k].y - 7);
                ctx.lineTo(centroids[k].x, centroids[k].y + 7);
                ctx.stroke();
            }
        }
        
        function updateStats() {
            document.getElementById('iterCount').textContent = iteration;
            document.getElementById('pointCount').textContent = points.length;
            document.getElementById('clusterCount').textContent = K;
            document.getElementById('statusText').textContent = 
                isRunning ? 'Running' : converged ? 'Converged' : 'Ready';
        }
        
        function updateStatus(msg) {
            document.getElementById('mainStatus').textContent = msg;
        }
        
        // Initial draw
        draw();
        updateStats();
    </script>
</body>
</html>
